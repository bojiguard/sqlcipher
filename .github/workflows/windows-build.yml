name: Build SQLCipher Windows x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout SQLCipher
        uses: actions/checkout@v4

      - name: Install OpenSSL
        shell: pwsh
        run: |
          choco install openssl --yes --no-progress

          $candidates = @(
            "C:\Program Files\OpenSSL",
            "C:\Program Files\OpenSSL-Win64",
            "C:\Program Files\OpenSSL-Win64\"
          )

          $source = $candidates | Where-Object {
            Test-Path "$_\include\openssl\crypto.h"
          } | Select-Object -First 1

          if (!$source) {
            throw "OpenSSL crypto.h not found"
          }

          New-Item -ItemType Directory -Force C:\OpenSSL | Out-Null
          Copy-Item "$source\include" C:\OpenSSL -Recurse -Force
          Copy-Item "$source\lib" C:\OpenSSL -Recurse -Force
          Copy-Item "$source\bin" C:\OpenSSL -Recurse -Force

          if (!(Test-Path "C:\OpenSSL\include\openssl\crypto.h")) {
            throw "OpenSSL header copy failed"
          }

          Write-Host "OpenSSL headers verified"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build SQLCipher
        shell: cmd
        run: |
          nmake /f Makefile.msc sqlite3.exe ^
            USE_AMALGAMATION=1 ^
            NO_TCL=1 ^
            OPT_FEATURE_FLAGS="-DSQLITE_HAS_CODEC=1 -DSQLITE_TEMP_STORE=2 -DSQLITE_EXTRA_INIT=sqlcipher_extra_init -DSQLITE_EXTRA_SHUTDOWN=sqlcipher_extra_shutdown -DSQLCIPHER_CRYPTO_OPENSSL=1" ^
            TCCOPTS=/IC:\OpenSSL\include ^
            LTLINKOPTS=C:\OpenSSL\lib\VC\x64\MD\libcrypto.lib

      - name: Verify executable
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter sqlite3.exe

      - name: Copy OpenSSL DLL
        shell: pwsh
        run: |
          Copy-Item "C:\OpenSSL\bin\libcrypto-3-x64.dll" -Destination .

      - name: Upload SQLCipher executable
        uses: actions/upload-artifact@v4
        with:
          name: sqlcipher-windows-x64
          path: |
            sqlite3.exe
            libcrypto-3-x64.dll
          if-no-files-found: error
